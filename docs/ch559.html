<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KB Bridge CH559 Flash</title>
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>
<main>
  <header>
    <h1>CH559 First Flash</h1>
    <button id="lang" class="link" type="button">English</button>
  </header>
  <p class="lead" data-i18n="lead"></p>

  <div id="unsupported" class="notice error" hidden data-i18n="unsupported"></div>

  <section>
    <h2 data-i18n="s1"></h2>
    <label class="field"><span data-i18n="board"></span>
      <select id="board"></select>
    </label>
    <label class="field"><span data-i18n="version"></span>
      <select id="fw"></select>
    </label>
    <details>
      <summary data-i18n="localSummary"></summary>
      <p class="muted" data-i18n="localHelp"></p>
      <input id="local" type="file" accept=".bin">
    </details>
  </section>

  <section>
    <h2 data-i18n="s2"></h2>
    <ol class="steps">
      <li data-i18n="step1"></li>
      <li data-i18n="step2"></li>
      <li data-i18n="step3"></li>
    </ol>
    <figure class="diagram"><img src="img/buttons.svg" style="max-width:100%;height:auto" alt="JP1 (BOOT) / PAIR / LOW-I"></figure>
    <p class="muted" data-i18n="windows"></p>
    <button id="go" class="primary" type="button" data-i18n="go"></button>
  </section>

  <section id="run" hidden>
    <h2 data-i18n="s3"></h2>
    <div class="bar"><div id="barfill"></div></div>
    <p id="status" class="status"></p>
  </section>
  <footer class="muted">
    <ul class="links">
      <li><a id="back" href="./">Firmware updater</a></li>
      <li><a href="guide_en.html#ch559">Build Guide(EN)</a></li>
      <li><a href="guide_ja.html#ch559">Build Guide(JA)</a></li>
    </ul>
  </footer>
</main>
<script type="module" src="js/ch559.js"></script>
</body>
</html>
